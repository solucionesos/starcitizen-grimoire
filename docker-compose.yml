services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ancalagon_backend
    restart: always
    ports:
      - "3001:3001"
    volumes:
      - backend_data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID:-}
      - DISCORD_CLIENT_SECRET=${DISCORD_CLIENT_SECRET:-}
      - DISCORD_REDIRECT_URI=${DISCORD_REDIRECT_URI:-https://sc.ancalagongames.com/api/auth/discord/callback}
      - FRONTEND_URL=${FRONTEND_URL:-https://sc.ancalagongames.com}
      - JWT_SECRET=${JWT_SECRET:-ancalagon-jwt-secret-key-2956}
      - AGENT_SYNC_TOKEN=${AGENT_SYNC_TOKEN:-ancalagon-sync-secret}
    deploy:
      resources:
        limits:
          cpus: '0.40'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M

  frontend:
    build:
      context: ./sc-frontend
      dockerfile: Dockerfile
    container_name: ancalagon_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          cpus: '0.15' # Máximo 15% de un núcleo
          memory: 64M # Límite estricto de 64MB para Nginx
        reservations:
          cpus: '0.05'
          memory: 32M

volumes:
  backend_data:
